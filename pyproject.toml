[tool.poetry]
name = "jeopardy"
version = "0.2.0"
description = "A classroom Jeopardy game built with pygame."
authors = ["danwiththeplan <dan837446@gmail.com>"]
readme = "README.md"
license = "GPL-3.0-or-later"
packages = [{ include = "jeopardy", from = "src" }]
include = ["src/jeopardy/resources/*.wav"]

[tool.poetry.dependencies]
python = "^3.12"
pygame = "^2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
jeopardy = "jeopardy.core:main"
jeopardy-gui = "jeopardy.gui:main"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
